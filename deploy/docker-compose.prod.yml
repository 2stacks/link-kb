# Production deployment example
# Place behind a reverse proxy (Caddy, nginx, etc.) on port 80/443.
# Adjust the embedding URL to match your production embedding service.

services:
  link-kb:
    build: ..
    restart: always
    # Do NOT expose port publicly — put behind a reverse proxy
    expose:
      - "5000"
    env_file:
      - ../.env
    volumes:
      - link-kb-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  link-kb-data:
    driver: local
