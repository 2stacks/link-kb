services:
  link-kb:
    build: .
    container_name: link-kb
    restart: unless-stopped
    ports:
      - "0.0.0.0:5000:5000"
    env_file:
      - .env
    volumes:
      - link-kb-data:/data
    # In production, llama-swap runs on the host.
    # Use host.network or explicit host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  link-kb-data:
    driver: local
